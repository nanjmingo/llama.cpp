name: Cleanup Llamango ccache

on:
  workflow_call:
    inputs:
      cache_key_prefix:
        description: Stable cache key prefix for one build target.
        required: true
        type: string

jobs:
  cleanup:
    name: Cleanup ccache
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    concurrency:
      group: ${{ inputs.cache_key_prefix }}-${{ github.ref }}
      queue: max
    steps:
      - name: Retain the latest cache for this build target
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          CACHE_KEY_PREFIX: ${{ inputs.cache_key_prefix }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prefix = process.env.CACHE_KEY_PREFIX;
            const keepCount = 1;
            const { owner, repo } = context.repo;
            const ref = context.ref;
            const caches = [];

            for (let page = 1; ; page += 1) {
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/actions/caches",
                {
                  owner,
                  repo,
                  ref,
                  key: prefix,
                  sort: "created_at",
                  direction: "desc",
                  per_page: 100,
                  page,
                },
              );
              const pageCaches = data.actions_caches ?? [];
              caches.push(
                ...pageCaches.filter(
                  (cache) =>
                    cache.ref === ref && cache.key.startsWith(`${prefix}-`),
                ),
              );

              if (pageCaches.length < 100) {
                break;
              }
            }

            caches.sort(
              (left, right) =>
                Date.parse(right.created_at) - Date.parse(left.created_at) ||
                right.id - left.id,
            );

            const staleCaches = caches.slice(keepCount);
            for (const cache of staleCaches) {
              try {
                await github.request(
                  "DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}",
                  { owner, repo, cache_id: cache.id },
                );
              } catch (error) {
                if (error.status === 404) {
                  continue;
                }
                throw error;
              }
            }
