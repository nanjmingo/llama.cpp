name: Llamango Windows CPU Build

on:
  workflow_call:
    inputs:
      architecture:
        description: Target architecture (x64 or arm64).
        required: true
        type: string
      runner:
        description: GitHub-hosted Windows runner with Visual Studio 2026.
        required: true
        type: string
      cache_key_prefix:
        description: Stable prefix for the ccache key and concurrency group.
        required: true
        type: string
      release_tag:
        description: Prerelease tag created by the orchestrator.
        required: true
        type: string
      asset_name:
        description: Package asset filename.
        required: true
        type: string
      skip_build:
        description: Skip this build when its release asset already exists.
        required: false
        default: false
        type: boolean

jobs:
  build:
    if: ${{ !inputs.skip_build }}
    concurrency:
      group: ${{ inputs.cache_key_prefix }}-${{ github.ref }}
      queue: max
    name: CPU
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ inputs.architecture }}

      - name: Install Python test dependencies
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($env:TARGET_ARCHITECTURE -eq 'arm64') {
            $requirementsFile = Join-Path $env:RUNNER_TEMP 'requirements-convert_legacy_llama-windows-arm64.txt'
            Get-Content -LiteralPath 'requirements/requirements-convert_legacy_llama.txt' |
              Where-Object { $_ -notmatch '^\s*numpy(?:\s|[<=>~!;]|$)' } |
              Set-Content -LiteralPath $requirementsFile -Encoding utf8NoBOM

            python -m pip install --disable-pip-version-check --only-binary=numpy `
              -r $requirementsFile `
              'numpy~=2.3.5' `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          } else {
            python -m pip install --disable-pip-version-check `
              -r requirements/requirements-convert_legacy_llama.txt `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          python -m pip install --disable-pip-version-check `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            'torch==2.12.0'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $pythonCheck = @'
          import platform
          import sys
          from importlib.metadata import version

          import jinja2
          import numpy
          import safetensors
          import torch
          from jinja2 import Environment

          jinja_version = version('Jinja2')
          if 'items' not in Environment().filters:
              raise SystemExit(f'Jinja2 items filter is unavailable (found {jinja_version})')

          print(f'Python: {sys.version}')
          print(f'Architecture: {platform.machine()}')
          print(f'Jinja2: {jinja_version}')
          print(f'NumPy: {numpy.__version__}')
          print(f'PyTorch: {torch.__version__}')
          print(f'Safetensors: {safetensors.__version__}')
          '@
          $pythonCheck | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install ccache
        id: install_ccache
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $version = '4.14.2'
          $package = switch ($env:TARGET_ARCHITECTURE) {
            'x64' {
              @{
                Architecture = 'x86_64'
                Sha256 = '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84'
              }
            }
            'arm64' {
              @{
                Architecture = 'aarch64'
                Sha256 = '47ea5a0ed661bea53962d8fb8ee9a1769092d979a6f7c73d3081499b3305b2ab'
              }
            }
            default { throw "Unsupported Windows architecture: $env:TARGET_ARCHITECTURE" }
          }

          $archiveName = "ccache-$version-windows-$($package.Architecture).zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installDir = Join-Path $env:RUNNER_TEMP 'ccache'
          $url = "https://github.com/ccache/ccache/releases/download/v$version/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $package.Sha256) {
            throw "ccache archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $ccacheExe = Get-ChildItem -Path $installDir -Filter ccache.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $ccacheExe) {
            throw 'ccache.exe was not found in the downloaded archive'
          }

          $ccacheBinDir = Split-Path -Parent $ccacheExe.FullName
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ccacheBinDir
          & $ccacheExe.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "ccache --version failed with exit code $LASTEXITCODE"
          }

      - name: Verify ccache is available on PATH
        id: verify_ccache
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          Write-Host "Using ccache: $($ccache.Source)"
          & $ccache.Source --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Initialize ccache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE '.ccache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          @(
            "CCACHE_DIR=$cacheDir"
            'CCACHE_MAXSIZE=1G'
            "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE"
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_COMPILERTYPE=msvc'
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value $_ }

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ inputs.cache_key_prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_key_prefix }}-

      - name: Configure and build full CPU build
        id: build
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $targetArchitecture = switch ($env:TARGET_ARCHITECTURE) {
            'x64'   { 'amd64' }
            'arm64' { 'arm64' }
            default { throw "Unsupported Windows architecture: $env:TARGET_ARCHITECTURE" }
          }

          # The selected GitHub-hosted VS2026 images install Enterprise at this path.
          $vsInstallPath = Join-Path $env:ProgramFiles 'Microsoft Visual Studio/18/Enterprise'
          $vsDevCmd = Join-Path $vsInstallPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          # Ninja needs the MSVC compiler environment initialized in the same process.
          $buildScript = Join-Path $env:RUNNER_TEMP 'llamango-build-windows-cpu.cmd'
          @"
          @echo off
          call "$vsDevCmd" -no_logo -arch=$targetArchitecture -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DLLAMA_BUILD_COMMON=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_TESTS=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_APP=ON ^
            -DLLAMA_ALL_WARNINGS=ON ^
            -DLLAMA_FATAL_WARNINGS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_OPENMP=OFF ^
            -DGGML_CPU=ON ^
            -DGGML_CUDA=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $buildScript -Encoding ascii

          & $env:ComSpec /d /c "`"$buildScript`""
          $buildExitCode = $LASTEXITCODE
          Remove-Item -LiteralPath $buildScript -Force -ErrorAction SilentlyContinue
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Package Windows CPU build
        id: package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "build/bin/Release"
          $llamangoExe = Join-Path $binDir "llama-finetune-qlora.exe"
          if (-not (Test-Path -LiteralPath $llamangoExe -PathType Leaf)) {
            throw "QLoRA executable was not found: $llamangoExe"
          }

          $executables = @(Get-ChildItem -Path $binDir -Filter "*.exe" -File -Recurse)
          $runtimeDlls = @(Get-ChildItem -Path $binDir -Filter "*.dll" -File -Recurse)
          if ($executables.Count -eq 0) {
            throw "No executables were found in $binDir"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "llamango-windows-$env:ARCH"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stageDir, $distDir | Out-Null
          Copy-Item -Path (Join-Path $binDir "*") -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $stageDir

          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "OS: Windows"
            "Architecture: $env:ARCH"
            "Backend: CPU"
            "Build scope: all default CMake targets"
            "Build type: Release"
            "MSVC runtime: static (/MT)"
            "Executables included: $($executables.Count)"
            "Runtime DLLs included: $($runtimeDlls.Count)"
          ) | Set-Content -Path (Join-Path $stageDir "BUILD_INFO.txt") -Encoding utf8

          $assetPath = Join-Path $distDir $env:ASSET_NAME
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $assetPath -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Windows CPU package was not created: $assetPath"
          }

      - name: Publish Windows CPU package
        if: always() && steps.package.outcome == 'success'
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: dist/${{ inputs.asset_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ inputs.cache_key_prefix }}-${{ github.run_id }}

      - name: Run all CPU tests
        id: test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE "ctest-windows-$env:ARCH.log"
          $junitFileName = "test-$env:RELEASE_TAG-windows-$env:ARCH-cpu.xml"
          $junitPath = Join-Path $env:GITHUB_WORKSPACE $junitFileName
          $ctestHelp = (& ctest --help 2>&1 | Out-String)
          $ctestArgs = @(
            '--test-dir', 'build',
            '-C', 'Release',
            '--output-on-failure',
            '--parallel', "$env:NUMBER_OF_PROCESSORS"
          )
          if ($ctestHelp -match '--output-junit') {
            $ctestArgs += @('--output-junit', $junitPath)
          } else {
            Write-Warning 'CTest does not support --output-junit (requires CTest 3.21 or newer); JUnit XML will not be published.'
          }

          $testOutput = & ctest @ctestArgs 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $logPath
          if (Test-Path -LiteralPath $junitPath -PathType Leaf) {
            "junit_file=$junitFileName" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            Write-Warning "CTest did not produce JUnit XML: $junitPath"
          }

          "exit_code=$testStatus" | Add-Content -Path $env:GITHUB_OUTPUT

          if ($testStatus -ne 0) {
            exit $testStatus
          }

      - name: Publish Windows CPU JUnit XML
        if: always() && steps.test.outputs.junit_file != ''
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: ${{ steps.test.outputs.junit_file }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-release: 'false'
