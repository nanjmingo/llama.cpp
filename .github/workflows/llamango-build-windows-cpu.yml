name: Llamango Windows CPU Build

on:
  workflow_call:
    inputs:
      architecture:
        description: Target architecture (x64 or arm64).
        required: true
        type: string
      runner:
        description: GitHub-hosted runner label.
        required: true
        type: string
      toolchain_file:
        description: CMake toolchain file.
        required: true
        type: string
      ccache_arch:
        description: Architecture suffix for the ccache release archive.
        required: true
        type: string
      ccache_sha256:
        description: Expected SHA-256 of the ccache release archive.
        required: true
        type: string
      openmp_args:
        description: Additional OpenMP CMake arguments.
        required: true
        type: string
      release_tag:
        description: Prerelease tag created by the orchestrator.
        required: true
        type: string
      asset_name:
        description: Package asset filename.
        required: true
        type: string

jobs:
  build:
    name: CPU
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ inputs.architecture }}

      - name: Install Python test dependencies
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($env:TARGET_ARCHITECTURE -eq 'arm64') {
            # Keep the shared requirements unchanged. NumPy 2.2.6 has no
            # CPython 3.12 Windows ARM64 wheel, so replace only its constraint
            # for this job and require the published ARM64 wheel.
            $requirementsFile = Join-Path $env:RUNNER_TEMP 'requirements-convert_legacy_llama-windows-arm64.txt'
            Get-Content -LiteralPath 'requirements/requirements-convert_legacy_llama.txt' |
              Where-Object { $_ -notmatch '^\s*numpy(?:\s|[<=>~!;]|$)' } |
              Set-Content -LiteralPath $requirementsFile -Encoding utf8NoBOM

            python -m pip install --disable-pip-version-check --only-binary=numpy `
              -r $requirementsFile `
              'numpy~=2.3.5' `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          } else {
            python -m pip install --disable-pip-version-check `
              -r requirements/requirements-convert_legacy_llama.txt `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # PyTorch 2.11.0 does not publish Windows ARM64 wheels. 2.12.0
          # publishes CPU wheels for both win_amd64 and win_arm64 (Python 3.12).
          python -m pip install --disable-pip-version-check `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            'torch==2.12.0'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $pythonCheck = @'
          import platform
          import sys
          from importlib.metadata import version

          import jinja2
          import numpy
          import safetensors
          import torch
          from jinja2 import Environment

          jinja_version = version('Jinja2')
          if 'items' not in Environment().filters:
              raise SystemExit(f'Jinja2 items filter is unavailable (found {jinja_version})')

          print(f'Python: {sys.version}')
          print(f'Architecture: {platform.machine()}')
          print(f'Jinja2: {jinja_version}')
          print(f'NumPy: {numpy.__version__}')
          print(f'PyTorch: {torch.__version__}')
          print(f'Safetensors: {safetensors.__version__}')
          '@
          $pythonCheck | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install ccache
        id: install_ccache
        shell: pwsh
        env:
          CCACHE_ARCH: ${{ inputs.ccache_arch }}
          CCACHE_SHA256: ${{ inputs.ccache_sha256 }}
        run: |
          $version = "4.14.2"
          $archiveName = "ccache-$version-windows-$env:CCACHE_ARCH.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installDir = Join-Path $env:RUNNER_TEMP "ccache"
          $url = "https://github.com/ccache/ccache/releases/download/v$version/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CCACHE_SHA256) {
            throw "ccache archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $ccacheExe = Get-ChildItem -Path $installDir -Filter ccache.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ccacheExe) {
            throw "ccache.exe was not found in the downloaded archive"
          }

          $ccacheExePath = $ccacheExe.FullName
          $ccacheBinDir = Split-Path -Parent $ccacheExePath
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ccacheBinDir
          & $ccacheExePath --version
          if ($LASTEXITCODE -ne 0) {
            throw "ccache --version failed with exit code $LASTEXITCODE"
          }

      - name: Verify ccache is available on PATH
        id: verify_ccache
        shell: pwsh
        run: |
          # Multiple ccache.exe binaries may be present on Windows runners
          # (for example, the downloaded release and Strawberry Perl). Select
          # the first match on PATH instead of treating all matches as one path.
          $ccache = Get-Command ccache -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          Write-Host "Using ccache: $($ccache.Source)"
          & $ccache.Source --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Initialize ccache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".ccache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          @(
            "CCACHE_DIR=$cacheDir"
            "CCACHE_MAXSIZE=2G"
            "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE"
            "CCACHE_COMPILERCHECK=content"
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value $_ }

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-${{ github.run_id }}
          restore-keys: |
            llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Install LLVM 20.1.8 for Windows ARM64
        if: inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          $version = "20.1.8"
          $installerName = "LLVM-$version-woa64.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          $installDir = Join-Path $env:RUNNER_TEMP "llvm-$version"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$installerName"

          Invoke-WebRequest -Uri $url -OutFile $installerPath
          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e") {
            throw "LLVM installer SHA-256 mismatch: $actualHash"
          }

          $process = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed with exit code $($process.ExitCode)"
          }

          $llvmBin = Join-Path $installDir "bin"
          $clang = Join-Path $llvmBin "clang.exe"
          if (-not (Test-Path -LiteralPath $clang)) {
            throw "LLVM clang.exe was not found at $clang"
          }

          $clangVersion = (& $clang --version | Select-Object -First 1)
          if ($clangVersion -notmatch 'clang version 20\.1\.8') {
            throw "Expected Clang 20.1.8, got: $clangVersion"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          $clangVersion

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Ninja installation failed with exit code $LASTEXITCODE"
            }
            $chocoBin = Join-Path $env:ChocolateyInstall "bin"
            Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
            $env:PATH = "$chocoBin;$env:PATH"
          }

          $ninja = Get-Command ninja -ErrorAction Stop
          & $ninja.Source --version

      - name: Configure full CPU build
        shell: pwsh
        env:
          LLAMANGO_TOOLCHAIN_FILE: ${{ inputs.toolchain_file }}
          LLAMANGO_OPENMP_ARGS: ${{ inputs.openmp_args }}
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Ninja Multi-Config',
            "-DCMAKE_TOOLCHAIN_FILE=$env:LLAMANGO_TOOLCHAIN_FILE",
            '-DLLAMA_BUILD_COMMON=ON',
            '-DLLAMA_BUILD_TOOLS=ON',
            '-DLLAMA_BUILD_TESTS=ON',
            '-DLLAMA_BUILD_EXAMPLES=ON',
            '-DLLAMA_BUILD_SERVER=ON',
            '-DLLAMA_BUILD_APP=ON',
            '-DLLAMA_ALL_WARNINGS=ON',
            '-DLLAMA_FATAL_WARNINGS=OFF',
            '-DLLAMA_BUILD_BORINGSSL=ON',
            '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
            '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache',
            '-DGGML_NATIVE=OFF',
            $env:LLAMANGO_OPENMP_ARGS,
            '-DGGML_CPU=ON',
            '-DGGML_CUDA=OFF'
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build all targets
        id: build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # llamango-tests is a custom target and is intentionally not part of the default ALL target.
          cmake --build build --config Release --target llamango-tests --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package Windows CPU build
        id: package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "build/bin/Release"
          $llamangoExe = Join-Path $binDir "llama-finetune-qlora.exe"
          if (-not (Test-Path -LiteralPath $llamangoExe -PathType Leaf)) {
            throw "QLoRA executable was not found: $llamangoExe"
          }

          $executables = @(Get-ChildItem -Path $binDir -Filter "*.exe" -File -Recurse)
          $runtimeDlls = @(Get-ChildItem -Path $binDir -Filter "*.dll" -File -Recurse)
          if ($executables.Count -eq 0) {
            throw "No executables were found in $binDir"
          }
          if ($runtimeDlls.Count -eq 0) {
            throw "No runtime DLLs were found in $binDir"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "llamango-windows-$env:ARCH"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stageDir, $distDir | Out-Null
          # Preserve all CMake runtime outputs and their relative paths, not only the QLoRA executable.
          Copy-Item -Path (Join-Path $binDir "*") -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $stageDir

          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "OS: Windows"
            "Architecture: $env:ARCH"
            "Backend: CPU"
            "Build scope: all default CMake targets plus llamango-tests"
            "Build type: Release"
            "Executables included: $($executables.Count)"
            "Runtime DLLs included: $($runtimeDlls.Count)"
          ) | Set-Content -Path (Join-Path $stageDir "BUILD_INFO.txt") -Encoding utf8

          $assetPath = Join-Path $distDir $env:ASSET_NAME
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $assetPath -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Windows CPU package was not created: $assetPath"
          }

      - name: Publish Windows CPU package
        if: always() && steps.package.outcome == 'success'
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: dist/${{ inputs.asset_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Show ccache statistics
        if: always() && steps.install_ccache.outcome == 'success' && steps.verify_ccache.outcome == 'success'
        shell: pwsh
        run: |
          # Match the selection logic used by the verification step above.
          $ccache = Get-Command ccache -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          & $ccache.Source --show-stats
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-${{ github.run_id }}

      - name: Run all CPU tests
        id: test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE "ctest-windows-$env:ARCH.log"
          $junitFileName = "test-$env:RELEASE_TAG-windows-$env:ARCH-cpu.xml"
          $junitPath = Join-Path $env:GITHUB_WORKSPACE $junitFileName
          $ctestHelp = (& ctest --help 2>&1 | Out-String)
          $ctestArgs = @(
            '--test-dir', 'build',
            '-C', 'Release',
            '--output-on-failure',
            '--parallel', "$env:NUMBER_OF_PROCESSORS"
          )
          if ($ctestHelp -match '--output-junit') {
            $ctestArgs += @('--output-junit', $junitPath)
          } else {
            Write-Warning 'CTest does not support --output-junit (requires CTest 3.21 or newer); JUnit XML will not be published.'
          }

          $testOutput = & ctest @ctestArgs 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $logPath
          if (Test-Path -LiteralPath $junitPath -PathType Leaf) {
            "junit_file=$junitFileName" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            Write-Warning "CTest did not produce JUnit XML: $junitPath"
          }

          "exit_code=$testStatus" | Add-Content -Path $env:GITHUB_OUTPUT

          if ($testStatus -ne 0) {
            exit $testStatus
          }

      - name: Publish Windows CPU JUnit XML
        if: always() && steps.test.outputs.junit_file != ''
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: ${{ steps.test.outputs.junit_file }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-release: 'false'

      - name: Fail job if Windows CPU tests failed
        if: always() && steps.test.outcome == 'failure'
        run: exit 1
