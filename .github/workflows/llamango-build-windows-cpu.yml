name: Llamango Windows CPU Build

on:
  workflow_call:
    inputs:
      architecture:
        description: Target architecture (x64 or arm64).
        required: true
        type: string
      runner:
        description: GitHub-hosted runner label.
        required: true
        type: string
      toolchain_file:
        description: CMake toolchain file.
        required: true
        type: string
      ccache_arch:
        description: Architecture suffix for the ccache release archive.
        required: true
        type: string
      ccache_sha256:
        description: Expected SHA-256 of the ccache release archive.
        required: true
        type: string
      openmp_args:
        description: Additional OpenMP CMake arguments.
        required: true
        type: string
      release_tag:
        description: Prerelease tag created by the orchestrator.
        required: true
        type: string
      asset_name:
        description: Package asset filename.
        required: true
        type: string

jobs:
  build:
    name: CPU
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ inputs.architecture }}

      - name: Install Python test dependencies
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($env:TARGET_ARCHITECTURE -eq 'arm64') {
            $requirementsFile = Join-Path $env:RUNNER_TEMP 'requirements-convert_legacy_llama-windows-arm64.txt'
            Get-Content -LiteralPath 'requirements/requirements-convert_legacy_llama.txt' |
              Where-Object { $_ -notmatch '^\s*numpy(?:\s|[<=>~!;]|$)' } |
              Set-Content -LiteralPath $requirementsFile -Encoding utf8NoBOM

            python -m pip install --disable-pip-version-check --only-binary=numpy `
              -r $requirementsFile `
              'numpy~=2.3.5' `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          } else {
            python -m pip install --disable-pip-version-check `
              -r requirements/requirements-convert_legacy_llama.txt `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          python -m pip install --disable-pip-version-check `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            'torch==2.12.0'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $pythonCheck = @'
          import platform
          import sys
          from importlib.metadata import version

          import jinja2
          import numpy
          import safetensors
          import torch
          from jinja2 import Environment

          jinja_version = version('Jinja2')
          if 'items' not in Environment().filters:
              raise SystemExit(f'Jinja2 items filter is unavailable (found {jinja_version})')

          print(f'Python: {sys.version}')
          print(f'Architecture: {platform.machine()}')
          print(f'Jinja2: {jinja_version}')
          print(f'NumPy: {numpy.__version__}')
          print(f'PyTorch: {torch.__version__}')
          print(f'Safetensors: {safetensors.__version__}')
          '@
          $pythonCheck | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install ccache
        id: install_ccache
        shell: pwsh
        env:
          CCACHE_ARCH: ${{ inputs.ccache_arch }}
          CCACHE_SHA256: ${{ inputs.ccache_sha256 }}
        run: |
          $version = "4.14.2"
          $archiveName = "ccache-$version-windows-$env:CCACHE_ARCH.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installDir = Join-Path $env:RUNNER_TEMP "ccache"
          $url = "https://github.com/ccache/ccache/releases/download/v$version/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CCACHE_SHA256) {
            throw "ccache archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $ccacheExe = Get-ChildItem -Path $installDir -Filter ccache.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ccacheExe) {
            throw "ccache.exe was not found in the downloaded archive"
          }

          $ccacheExePath = $ccacheExe.FullName
          $ccacheBinDir = Split-Path -Parent $ccacheExePath
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ccacheBinDir
          & $ccacheExePath --version
          if ($LASTEXITCODE -ne 0) {
            throw "ccache --version failed with exit code $LASTEXITCODE"
          }

      - name: Verify ccache is available on PATH
        id: verify_ccache
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          Write-Host "Using ccache: $($ccache.Source)"
          & $ccache.Source --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Initialize ccache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".ccache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          @(
            "CCACHE_DIR=$cacheDir"
            "CCACHE_MAXSIZE=1G"
            "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE"
            "CCACHE_COMPILERCHECK=content"
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value $_ }

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-${{ github.run_id }}
          restore-keys: |
            llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Install LLVM 20.1.8 for Windows ARM64
        if: inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          $version = "20.1.8"
          $installerName = "LLVM-$version-woa64.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          $installDir = Join-Path $env:RUNNER_TEMP "llvm-$version"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$installerName"

          Invoke-WebRequest -Uri $url -OutFile $installerPath
          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e") {
            throw "LLVM installer SHA-256 mismatch: $actualHash"
          }

          $process = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed with exit code $($process.ExitCode)"
          }

          $llvmBin = Join-Path $installDir "bin"
          $clang = Join-Path $llvmBin "clang.exe"
          if (-not (Test-Path -LiteralPath $clang)) {
            throw "LLVM clang.exe was not found at $clang"
          }

          $clangVersion = (& $clang --version | Select-Object -First 1)
          if ($clangVersion -notmatch 'clang version 20\.1\.8') {
            throw "Expected Clang 20.1.8, got: $clangVersion"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          $clangVersion

      - name: Select a Clang-compatible MSVC toolset for Windows ARM64
        if: inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          $vswherePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswherePath -PathType Leaf)) {
            $vswhere = Get-Command vswhere.exe -CommandType Application -ErrorAction Stop |
              Select-Object -First 1
            $vswherePath = $vswhere.Source
          }

          function Get-CompatibleToolsets {
            param([string[]]$InstallationPaths)

            foreach ($installationPath in $InstallationPaths) {
              $toolsetRoot = Join-Path $installationPath 'VC\Tools\MSVC'
              if (-not (Test-Path -LiteralPath $toolsetRoot -PathType Container)) {
                continue
              }

              $toolsetDirectories = Get-ChildItem -LiteralPath $toolsetRoot -Directory |
                Where-Object { $_.Name -match '^14\.(44|51)\.\d+$' }

              foreach ($toolsetDirectory in $toolsetDirectories) {
                $includePath = Join-Path $toolsetDirectory.FullName 'include\yvals_core.h'
                $arm64LibraryPath = Join-Path $toolsetDirectory.FullName 'lib\arm64'
                $vcvarsall = Join-Path $installationPath 'VC\Auxiliary\Build\vcvarsall.bat'
                if ((Test-Path -LiteralPath $includePath -PathType Leaf) -and
                    (Test-Path -LiteralPath $arm64LibraryPath -PathType Container) -and
                    (Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
                  [PSCustomObject]@{
                    InstallationPath = $installationPath
                    Version = $toolsetDirectory.Name
                  }
                }
              }
            }
          }

          $vsInstallPaths = @(
            & $vswherePath -all -products '*' -property installationPath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object { $_.Trim() } |
              Select-Object -Unique
          )
          if ($LASTEXITCODE -ne 0 -or $vsInstallPaths.Count -eq 0) {
            throw 'No Visual Studio installation was found'
          }

          $compatibleToolsets = @(Get-CompatibleToolsets -InstallationPaths $vsInstallPaths)
          if ($compatibleToolsets.Count -eq 0) {
            $vs2026InstallPath = & $vswherePath -all -products '*' -version '[18.0,19.0)' -property installationPath |
              Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs2026InstallPath)) {
              throw 'No Clang-compatible MSVC toolset was found and Visual Studio 2026 is unavailable for installing MSVC 14.51'
            }

            $channelId = & $vswherePath -all -products '*' -version '[18.0,19.0)' -property channelId |
              Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($channelId)) {
              throw 'Visual Studio 2026 channel ID was not found'
            }

            $component = 'Microsoft.VisualStudio.Component.VC.14.51.ARM64'
            $componentInstances = @(
              & $vswherePath -all -products '*' -requires $component -property installationPath |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                ForEach-Object { $_.Trim() }
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to query installed Visual Studio components'
            }

            if (-not ($componentInstances | Where-Object { $_ -ieq $vs2026InstallPath.Trim() })) {
              $setupPath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
              if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
                throw "Visual Studio Installer was not found: $setupPath"
              }

              Write-Host 'Installing the MSVC 14.51 ARM64 toolset'
              $arguments = 'modify --installPath "{0}" --channelId "{1}" --add "{2}" --quiet --norestart' -f `
                $vs2026InstallPath, $channelId, $component
              $installerProcess = Start-Process -FilePath $setupPath -ArgumentList $arguments -Wait -PassThru
              if ($installerProcess.ExitCode -notin @(0, 3010)) {
                throw "MSVC 14.51 installation failed with exit code $($installerProcess.ExitCode)"
              }
            }

            $vsInstallPaths = @(
              & $vswherePath -all -products '*' -property installationPath |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                ForEach-Object { $_.Trim() } |
                Select-Object -Unique
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to enumerate Visual Studio installations after installing MSVC 14.51'
            }

            $compatibleToolsets = @(Get-CompatibleToolsets -InstallationPaths $vsInstallPaths)
          }

          $selectedToolset = $compatibleToolsets |
            Sort-Object -Property @{ Expression = { [version]$_.Version }; Descending = $true } |
            Select-Object -First 1
          if ($null -eq $selectedToolset) {
            throw 'No ARM64 MSVC 14.44 or 14.51 toolset was found after toolset selection'
          }

          $vcvarsall = Join-Path $selectedToolset.InstallationPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
            throw "vcvarsall.bat was not found: $vcvarsall"
          }

          $command = 'call "{0}" amd64_arm64 -vcvars_ver={1} && set' -f $vcvarsall, $selectedToolset.Version
          $environmentOutput = & $env:ComSpec /d /s /c $command 2>&1
          if ($LASTEXITCODE -ne 0) {
            $environmentOutput | Write-Host
            throw "Failed to initialize MSVC $($selectedToolset.Version) for ARM64"
          }

          $environmentNames = @(
            'PATH'
            'INCLUDE'
            'LIB'
            'LIBPATH'
            'VCINSTALLDIR'
            'VCToolsInstallDir'
            'VCToolsVersion'
            'VSINSTALLDIR'
            'WindowsSdkDir'
            'WindowsSDKVersion'
            'UniversalCRTSdkDir'
            'UCRTVersion'
            'ExtensionSdkDir'
          )
          $environment = @{}
          foreach ($line in $environmentOutput) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) {
              continue
            }

            $name = $line.Substring(0, $separator)
            if ($name -in $environmentNames) {
              $environment[$name] = $line.Substring($separator + 1)
            }
          }

          if ($environment['VCToolsVersion'] -notmatch '^14\.(44|51)\.') {
            throw "Expected MSVC 14.44 or 14.51, got: $($environment['VCToolsVersion'])"
          }
          if ([string]::IsNullOrWhiteSpace($environment['VCToolsInstallDir'])) {
            throw 'VCToolsInstallDir was not set by vcvarsall.bat'
          }

          $llvmBin = Join-Path $env:RUNNER_TEMP 'llvm-20.1.8\bin'
          $clang = Join-Path $llvmBin 'clang++.exe'
          if (-not (Test-Path -LiteralPath $clang -PathType Leaf)) {
            throw "Clang was not found: $clang"
          }
          $environment['PATH'] = "$llvmBin;$($environment['PATH'])"

          foreach ($name in $environmentNames) {
            if (-not $environment.ContainsKey($name)) {
              continue
            }

            Set-Item -Path "Env:$name" -Value $environment[$name]
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$($environment[$name])" -Encoding utf8NoBOM
          }

          Write-Host "Using MSVC toolset $($environment['VCToolsVersion'])"
          Write-Host "Using MSVC headers from $($environment['VCToolsInstallDir'])"

          $probe = @'
          #include <vector>
          int main() {
              std::vector<int> values;
              return static_cast<int>(values.size());
          }
          '@
          $probeOutput = $probe | & $clang --target=arm64-pc-windows-msvc -fsyntax-only -x c++ - 2>&1
          $probeStatus = $LASTEXITCODE
          $probeOutput | Write-Host
          if ($probeStatus -ne 0) {
            throw "Clang 20.1.8 could not compile the MSVC STL probe with MSVC $($environment['VCToolsVersion']) (exit code $probeStatus)"
          }

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Ninja installation failed with exit code $LASTEXITCODE"
            }
            $chocoBin = Join-Path $env:ChocolateyInstall "bin"
            Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
            $env:PATH = "$chocoBin;$env:PATH"
          }

          $ninja = Get-Command ninja -ErrorAction Stop
          & $ninja.Source --version

      - name: Prepare LLVM OpenMP runtime
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $version = '20.1.8'
          switch ($env:TARGET_ARCHITECTURE) {
            'x64' {
              $openmpArch = 'x64'
              $installerSuffix = 'win64'
              $installerSha256 = '3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b'
            }
            'arm64' {
              $openmpArch = 'arm64'
              $installerSuffix = 'woa64'
              $installerSha256 = '7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e'
            }
            default {
              throw "Unsupported Windows architecture: $env:TARGET_ARCHITECTURE"
            }
          }

          $root = Join-Path $env:GITHUB_WORKSPACE "build/_deps/llvm-openmp-$version-$openmpArch"
          $libraryDir = Join-Path $root 'lib'
          $runtimeDir = Join-Path $root 'bin'
          $includeDir = Join-Path $root 'include'
          $libraryPath = Join-Path $libraryDir 'libomp.lib'
          $runtimePath = Join-Path $runtimeDir 'libomp.dll'
          $headerPath = Join-Path $includeDir 'omp.h'

          $runtimeFilesPresent = (Test-Path -LiteralPath $libraryPath) -and
            (Test-Path -LiteralPath $runtimePath) -and
            (Test-Path -LiteralPath $headerPath)

          if (-not $runtimeFilesPresent) {
            $installerName = "LLVM-$version-$installerSuffix.exe"
            $installerPath = Join-Path $env:RUNNER_TEMP $installerName
            $installerUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$installerName"
            $downloadInstaller = $true

            if (Test-Path -LiteralPath $installerPath) {
              $existingHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existingHash -eq $installerSha256) {
                $downloadInstaller = $false
              }
            }

            if ($downloadInstaller) {
              Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue
              $downloaded = $false
              for ($attempt = 1; $attempt -le 4; $attempt++) {
                try {
                  Write-Host "Downloading $installerName (attempt $attempt/4)"
                  Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -MaximumRedirection 10 -TimeoutSec 1800
                  $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualHash -ne $installerSha256) {
                    throw "LLVM installer SHA-256 mismatch: $actualHash"
                  }
                  $downloaded = $true
                  break
                }
                catch {
                  Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue
                  if ($attempt -eq 4) {
                    throw
                  }
                  Write-Warning "LLVM installer download failed: $_"
                  Start-Sleep -Seconds (5 * $attempt)
                }
              }
              if (-not $downloaded) {
                throw "Failed to download and verify $installerName"
              }
            }

            New-Item -ItemType Directory -Force -Path $libraryDir, $runtimeDir, $includeDir | Out-Null
            $extractDir = Join-Path $root 'extract'
            Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

            $sevenZip = Get-Command 7z -CommandType Application -ErrorAction Stop
            & $sevenZip.Source e -y "-o$extractDir" $installerPath -r libomp.lib libomp.dll omp.h
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract LLVM OpenMP files (7-Zip exit code $LASTEXITCODE)"
            }

            foreach ($fileName in @('libomp.lib', 'libomp.dll', 'omp.h')) {
              $extractedPath = Join-Path $extractDir $fileName
              if (-not (Test-Path -LiteralPath $extractedPath -PathType Leaf)) {
                throw "LLVM installer did not contain required OpenMP file: $fileName"
              }
            }

            Copy-Item -LiteralPath (Join-Path $extractDir 'libomp.lib') -Destination $libraryPath -Force
            Copy-Item -LiteralPath (Join-Path $extractDir 'libomp.dll') -Destination $runtimePath -Force
            Copy-Item -LiteralPath (Join-Path $extractDir 'omp.h') -Destination $headerPath -Force
            Remove-Item -LiteralPath $extractDir -Recurse -Force
          }

          $licensePath = Join-Path $root 'LICENSE.TXT'
          $licenseSha256 = 'fdad1758a9e1f9d5a81e18879b3406772115edc92c24bfa36b70c654f325e8e4'
          $licenseValid = $false
          if (Test-Path -LiteralPath $licensePath) {
            $licenseHash = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $licenseValid = $licenseHash -eq $licenseSha256
          }
          if (-not $licenseValid) {
            $licenseUrl = "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$version/openmp/LICENSE.TXT"
            $licenseDownloaded = $false
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Invoke-WebRequest -Uri $licenseUrl -OutFile $licensePath -MaximumRedirection 10 -TimeoutSec 120
                $actualLicenseHash = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actualLicenseHash -ne $licenseSha256) {
                  throw "LLVM OpenMP license SHA-256 mismatch: $actualLicenseHash"
                }
                $licenseDownloaded = $true
                break
              }
              catch {
                Remove-Item -LiteralPath $licensePath -Force -ErrorAction SilentlyContinue
                if ($attempt -eq 4) {
                  throw
                }
                Write-Warning "LLVM OpenMP license download failed: $_"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $licenseDownloaded) {
              throw 'Failed to download and verify the LLVM OpenMP license'
            }
          }

          Write-Host "Prepared LLVM OpenMP $version for $openmpArch"

      - name: Configure full CPU build
        shell: pwsh
        env:
          LLAMANGO_TOOLCHAIN_FILE: ${{ inputs.toolchain_file }}
          LLAMANGO_OPENMP_ARGS: ${{ inputs.openmp_args }}
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Ninja Multi-Config',
            "-DCMAKE_TOOLCHAIN_FILE=$env:LLAMANGO_TOOLCHAIN_FILE",
            '-DLLAMA_BUILD_COMMON=ON',
            '-DLLAMA_BUILD_TOOLS=ON',
            '-DLLAMA_BUILD_TESTS=ON',
            '-DLLAMA_BUILD_EXAMPLES=ON',
            '-DLLAMA_BUILD_SERVER=ON',
            '-DLLAMA_BUILD_APP=ON',
            '-DLLAMA_ALL_WARNINGS=ON',
            '-DLLAMA_FATAL_WARNINGS=OFF',
            '-DLLAMA_BUILD_BORINGSSL=ON',
            '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
            '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache',
            '-DGGML_NATIVE=OFF',
            $env:LLAMANGO_OPENMP_ARGS,
            '-DGGML_CPU=ON',
            '-DGGML_CUDA=OFF'
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build all targets
        id: build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package Windows CPU build
        id: package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "build/bin/Release"
          $llamangoExe = Join-Path $binDir "llama-finetune-qlora.exe"
          if (-not (Test-Path -LiteralPath $llamangoExe -PathType Leaf)) {
            throw "QLoRA executable was not found: $llamangoExe"
          }

          $executables = @(Get-ChildItem -Path $binDir -Filter "*.exe" -File -Recurse)
          $runtimeDlls = @(Get-ChildItem -Path $binDir -Filter "*.dll" -File -Recurse)
          if ($executables.Count -eq 0) {
            throw "No executables were found in $binDir"
          }
          if ($runtimeDlls.Count -eq 0) {
            throw "No runtime DLLs were found in $binDir"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "llamango-windows-$env:ARCH"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stageDir, $distDir | Out-Null
          Copy-Item -Path (Join-Path $binDir "*") -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $stageDir

          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "OS: Windows"
            "Architecture: $env:ARCH"
            "Backend: CPU"
            "Build scope: all default CMake targets"
            "Build type: Release"
            "Executables included: $($executables.Count)"
            "Runtime DLLs included: $($runtimeDlls.Count)"
          ) | Set-Content -Path (Join-Path $stageDir "BUILD_INFO.txt") -Encoding utf8

          $assetPath = Join-Path $distDir $env:ASSET_NAME
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $assetPath -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Windows CPU package was not created: $assetPath"
          }

      - name: Publish Windows CPU package
        if: always() && steps.package.outcome == 'success'
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: dist/${{ inputs.asset_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Show ccache statistics
        if: always() && steps.install_ccache.outcome == 'success' && steps.verify_ccache.outcome == 'success'
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          & $ccache.Source --show-stats
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: llamango-cache-windows-cpu-${{ inputs.architecture }}-4.14.2-${{ github.run_id }}

      - name: Run all CPU tests
        id: test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE "ctest-windows-$env:ARCH.log"
          $junitFileName = "test-$env:RELEASE_TAG-windows-$env:ARCH-cpu.xml"
          $junitPath = Join-Path $env:GITHUB_WORKSPACE $junitFileName
          $ctestHelp = (& ctest --help 2>&1 | Out-String)
          $ctestArgs = @(
            '--test-dir', 'build',
            '-C', 'Release',
            '--output-on-failure',
            '--parallel', "$env:NUMBER_OF_PROCESSORS"
          )
          if ($ctestHelp -match '--output-junit') {
            $ctestArgs += @('--output-junit', $junitPath)
          } else {
            Write-Warning 'CTest does not support --output-junit (requires CTest 3.21 or newer); JUnit XML will not be published.'
          }

          $testOutput = & ctest @ctestArgs 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $logPath
          if (Test-Path -LiteralPath $junitPath -PathType Leaf) {
            "junit_file=$junitFileName" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            Write-Warning "CTest did not produce JUnit XML: $junitPath"
          }

          "exit_code=$testStatus" | Add-Content -Path $env:GITHUB_OUTPUT

          if ($testStatus -ne 0) {
            exit $testStatus
          }

      - name: Publish Windows CPU JUnit XML
        if: always() && steps.test.outputs.junit_file != ''
        uses: ./.github/actions/llamango-release-upload
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: ${{ steps.test.outputs.junit_file }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-release: 'false'

      - name: Fail job if Windows CPU tests failed
        if: always() && steps.test.outcome == 'failure'
        run: exit 1
