name: Llamango Windows CPU Build

on:
  workflow_call:
    inputs:
      architecture:
        description: Target architecture (x64 or arm64).
        required: true
        type: string
      runner:
        description: GitHub-hosted Windows runner with Visual Studio 2026.
        required: true
        type: string
      cache_key_prefix:
        description: Stable prefix for the ccache key and concurrency group.
        required: true
        type: string
      release_tag:
        description: Prerelease tag created by the orchestrator.
        required: true
        type: string
      asset_name:
        description: Package asset filename.
        required: true
        type: string
      skip_build:
        description: Skip this build when its release asset already exists.
        required: false
        default: false
        type: boolean

jobs:
  build:
    if: ${{ !inputs.skip_build }}
    concurrency:
      group: ${{ inputs.cache_key_prefix }}-${{ github.ref }}
      queue: max
    name: CPU
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ inputs.architecture }}

      - name: Install Python test dependencies
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($env:TARGET_ARCHITECTURE -eq 'arm64') {
            $requirementsFile = Join-Path $env:RUNNER_TEMP 'requirements-convert_legacy_llama-windows-arm64.txt'
            Get-Content -LiteralPath 'requirements/requirements-convert_legacy_llama.txt' |
              Where-Object { $_ -notmatch '^\s*numpy(?:\s|[<=>~!;]|$)' } |
              Set-Content -LiteralPath $requirementsFile -Encoding utf8NoBOM

            python -m pip install --disable-pip-version-check --only-binary=numpy `
              -r $requirementsFile `
              'numpy~=2.3.5' `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          } else {
            python -m pip install --disable-pip-version-check `
              -r requirements/requirements-convert_legacy_llama.txt `
              'Jinja2>=3.1,<4' `
              'safetensors>=0.4.3'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          python -m pip install --disable-pip-version-check `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            'torch==2.12.0'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $pythonCheck = @'
          from importlib.metadata import version

          import numpy
          import safetensors
          import torch
          from jinja2 import Environment

          jinja_version = version('Jinja2')
          if 'items' not in Environment().filters:
              raise SystemExit(f'Jinja2 items filter is unavailable (found {jinja_version})')

          '@
          $pythonCheck | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install ccache
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $version = '4.14.2'
          $package = switch ($env:TARGET_ARCHITECTURE) {
            'x64' {
              @{
                Architecture = 'x86_64'
                Sha256 = '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84'
              }
            }
            'arm64' {
              @{
                Architecture = 'aarch64'
                Sha256 = '47ea5a0ed661bea53962d8fb8ee9a1769092d979a6f7c73d3081499b3305b2ab'
              }
            }
            default { throw "Unsupported Windows architecture: $env:TARGET_ARCHITECTURE" }
          }

          $archiveName = "ccache-$version-windows-$($package.Architecture).zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installDir = Join-Path $env:RUNNER_TEMP 'ccache'
          $url = "https://github.com/ccache/ccache/releases/download/v$version/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $package.Sha256) {
            throw "ccache archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $ccacheExe = Get-ChildItem -Path $installDir -Filter ccache.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $ccacheExe) {
            throw 'ccache.exe was not found in the downloaded archive'
          }

          $ccacheBinDir = Split-Path -Parent $ccacheExe.FullName
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ccacheBinDir
          & $ccacheExe.FullName --version *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "ccache --version failed with exit code $LASTEXITCODE"
          }

      - name: Initialize ccache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE '.ccache'
          $debugDir = Join-Path $env:RUNNER_TEMP 'ccache-debug'
          New-Item -ItemType Directory -Force -Path $cacheDir, $debugDir | Out-Null
          @(
            "CCACHE_DIR=$cacheDir"
            'CCACHE_MAXSIZE=1G'
            "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE"
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_COMPILERTYPE=clang-cl'
            'CCACHE_DEBUG=1'
            'CCACHE_DEBUGLEVEL=1'
            "CCACHE_DEBUGDIR=$debugDir"
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value $_ }

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ inputs.cache_key_prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_key_prefix }}-

      - name: Show restored ccache statistics
        shell: pwsh
        run: |
          try {
            ccache --show-stats --verbose
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to show restored ccache statistics (exit code $LASTEXITCODE)."
            }
          } catch {
            Write-Warning "Failed to show restored ccache statistics: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Reset ccache statistics before build
        shell: pwsh
        run: |
          try {
            ccache --zero-stats
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to reset ccache statistics (exit code $LASTEXITCODE)."
            }
          } catch {
            Write-Warning "Failed to reset ccache statistics: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Download LLVM OpenMP runtime
        id: download_openmp
        if: inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          $version = '22.1.8'
          $installerName = "LLVM-$version-woa64.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          $openmpRoot = Join-Path $env:RUNNER_TEMP "llvm-openmp-$version-arm64"
          $extractDir = Join-Path $openmpRoot 'extract'
          $installerUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$installerName"
          $expectedSha256 = '76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396'

          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $actualSha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "LLVM installer SHA-256 mismatch: $actualSha256"
          }

          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $sevenZip e -y "-o$extractDir" $installerPath -r libomp.lib libomp.dll omp.h
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM OpenMP files: $LASTEXITCODE"
          }

          $includeDir = Join-Path $openmpRoot 'include'
          $libDir = Join-Path $openmpRoot 'lib'
          $binDir = Join-Path $openmpRoot 'bin'
          New-Item -ItemType Directory -Force -Path $includeDir, $libDir, $binDir | Out-Null
          foreach ($file in @('omp.h', 'libomp.lib', 'libomp.dll')) {
            $sourcePath = Join-Path $extractDir $file
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "LLVM OpenMP file was not extracted: $sourcePath"
            }
          }
          Move-Item -LiteralPath (Join-Path $extractDir 'omp.h') -Destination $includeDir
          Move-Item -LiteralPath (Join-Path $extractDir 'libomp.lib') -Destination $libDir
          Move-Item -LiteralPath (Join-Path $extractDir 'libomp.dll') -Destination $binDir

          $licensePath = Join-Path $openmpRoot 'LICENSE.TXT'
          $licenseUrl = "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$version/openmp/LICENSE.TXT"
          Invoke-WebRequest -Uri $licenseUrl -OutFile $licensePath
          if (-not (Test-Path -LiteralPath $licensePath -PathType Leaf) -or (Get-Item -LiteralPath $licensePath).Length -eq 0) {
            throw "LLVM OpenMP license was not downloaded: $licensePath"
          }

          $cmakeRoot = $openmpRoot.Replace('\', '/')
          $cmakeCacheFile = Join-Path $env:RUNNER_TEMP 'llamango-openmp-arm64-initial-cache.cmake'
          @"
          set(OpenMP_libomp_LIBRARY "$cmakeRoot/lib/libomp.lib" CACHE FILEPATH "" FORCE)
          set(OpenMP_C_INCLUDE_DIR "$cmakeRoot/include" CACHE PATH "" FORCE)
          set(OpenMP_CXX_INCLUDE_DIR "$cmakeRoot/include" CACHE PATH "" FORCE)
          "@ | Set-Content -LiteralPath $cmakeCacheFile -Encoding ascii

          Remove-Item -LiteralPath $installerPath -Force
          Remove-Item -LiteralPath $extractDir -Recurse -Force
          "LLAMANGO_OPENMP_ROOT=$openmpRoot" | Add-Content -Path $env:GITHUB_ENV
          "LLAMANGO_OPENMP_CMAKE_CACHE=$cmakeCacheFile" | Add-Content -Path $env:GITHUB_ENV

      - name: Configure and build full CPU build
        id: build
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $buildTarget = switch ($env:TARGET_ARCHITECTURE) {
            'x64' {
              [pscustomobject]@{
                VsArchitecture = 'amd64'
                Triple = 'x86_64-pc-windows-msvc'
              }
            }
            'arm64' {
              [pscustomobject]@{
                VsArchitecture = 'arm64'
                Triple = 'aarch64-pc-windows-msvc'
              }
            }
            default { throw "Unsupported Windows architecture: $env:TARGET_ARCHITECTURE" }
          }
          $targetArchitecture = $buildTarget.VsArchitecture
          $targetTriple = $buildTarget.Triple
          if ($env:TARGET_ARCHITECTURE -eq 'arm64') {
            $openmpEnvironmentSetup = @"
          set "INCLUDE=$env:LLAMANGO_OPENMP_ROOT\include;%INCLUDE%"
          set "LIB=$env:LLAMANGO_OPENMP_ROOT\lib;%LIB%"
          "@
            $openmpCmakeArguments = @"
          -C "$env:LLAMANGO_OPENMP_CMAKE_CACHE" ^
          -DGGML_OPENMP_FETCH=OFF ^
          "@
          } else {
            $openmpEnvironmentSetup = ''
            $openmpCmakeArguments = @'
          -DGGML_OPENMP_FETCH=ON ^
          '@
          }

          $vsInstallPath = Join-Path $env:ProgramFiles 'Microsoft Visual Studio/18/Enterprise'
          $vsDevCmd = Join-Path $vsInstallPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          $buildScript = Join-Path $env:RUNNER_TEMP 'llamango-build-windows-cpu.cmd'
          @"
          @echo off
          call "$vsDevCmd" -no_logo -arch=$targetArchitecture -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          where clang-cl >nul
          if errorlevel 1 exit /b 1
          $openmpEnvironmentSetup
          cmake -S . -B build -G "Ninja Multi-Config" ^
            $openmpCmakeArguments
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_TARGET=$targetTriple ^
            -DCMAKE_CXX_COMPILER_TARGET=$targetTriple ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DLLAMA_BUILD_COMMON=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_TESTS=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_APP=ON ^
            -DLLAMA_ALL_WARNINGS=ON ^
            -DLLAMA_FATAL_WARNINGS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_OPENMP=ON ^
            -DGGML_CPU=ON ^
            -DGGML_CUDA=OFF
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $buildScript -Encoding ascii

          & $env:ComSpec /d /c "`"$buildScript`""
          $buildExitCode = $LASTEXITCODE
          Remove-Item -LiteralPath $buildScript -Force -ErrorAction SilentlyContinue
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Show ccache statistics after build
        if: always() && steps.build.outcome != 'skipped'
        shell: pwsh
        run: |
          try {
            ccache --show-stats --verbose
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to show ccache statistics after build (exit code $LASTEXITCODE)."
            }
          } catch {
            Write-Warning "Failed to show ccache statistics after build: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Copy LLVM OpenMP runtime to build output
        id: openmp_runtime
        if: always() && steps.build.outcome == 'success' && inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE 'build/bin/Release'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:LLAMANGO_OPENMP_ROOT 'bin/libomp.dll') -Destination $binDir -Force
          Copy-Item -LiteralPath (Join-Path $env:LLAMANGO_OPENMP_ROOT 'LICENSE.TXT') -Destination (Join-Path $binDir 'LICENSE-LLVM-OpenMP') -Force

          foreach ($file in @('libomp.dll', 'LICENSE-LLVM-OpenMP')) {
            $outputPath = Join-Path $binDir $file
            if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
              throw "LLVM OpenMP runtime file was not copied to the build output: $outputPath"
            }
          }

      - name: Package Windows CPU build
        id: package
        if: always() && steps.build.outcome == 'success' && (inputs.architecture != 'arm64' || steps.openmp_runtime.outcome == 'success')
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "build/bin/Release"
          $llamangoExe = Join-Path $binDir "llama-finetune-qlora.exe"
          if (-not (Test-Path -LiteralPath $llamangoExe -PathType Leaf)) {
            throw "QLoRA executable was not found: $llamangoExe"
          }

          $executables = @(Get-ChildItem -Path $binDir -Filter "*.exe" -File -Recurse)
          $runtimeDlls = @(Get-ChildItem -Path $binDir -Filter "*.dll" -File -Recurse)
          if ($env:ARCH -eq 'arm64') {
            foreach ($file in @('libomp.dll', 'LICENSE-LLVM-OpenMP')) {
              if (-not (Test-Path -LiteralPath (Join-Path $binDir $file) -PathType Leaf)) {
                throw "Required LLVM OpenMP package file is missing: $file"
              }
            }
          }
          if ($executables.Count -eq 0) {
            throw "No executables were found in $binDir"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "llamango-windows-$env:ARCH"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stageDir, $distDir | Out-Null
          Copy-Item -Path (Join-Path $binDir "*") -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $stageDir

          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "OS: Windows"
            "Architecture: $env:ARCH"
            "Backend: CPU"
            "Build scope: all default CMake targets"
            "Build type: Release"
            "C/C++ compiler: Clang (clang-cl)"
            "Executables included: $($executables.Count)"
            "Runtime DLLs included: $($runtimeDlls.Count)"
          ) | Set-Content -Path (Join-Path $stageDir "BUILD_INFO.txt") -Encoding utf8

          $assetPath = Join-Path $distDir $env:ASSET_NAME
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $assetPath -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Windows CPU package was not created: $assetPath"
          }

      - name: Publish Windows CPU package
        if: always() && steps.package.outcome == 'success'
        uses: ./.github/actions/llamango-upload-release-asset
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: dist/${{ inputs.asset_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Evict stale ccache entries
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          try {
            ccache --evict-older-than 5d
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ccache eviction failed with exit code $LASTEXITCODE; continuing without cleanup."
            }
          } catch {
            Write-Warning "ccache eviction failed: $_; continuing without cleanup."
          }
          $global:LASTEXITCODE = 0

      - name: Show ccache statistics after eviction
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          try {
            ccache --show-stats --verbose
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to show ccache statistics after eviction (exit code $LASTEXITCODE)."
            }
          } catch {
            Write-Warning "Failed to show ccache statistics after eviction: $_"
          }
          $global:LASTEXITCODE = 0

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ inputs.cache_key_prefix }}-${{ github.run_id }}

      - name: Run all CPU tests
        id: test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ARCH: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $junitFileName = "test-$env:RELEASE_TAG-windows-$env:ARCH-cpu.xml"
          $junitPath = Join-Path $env:GITHUB_WORKSPACE $junitFileName
          $ctestHelp = (& ctest --help 2>&1 | Out-String)
          $ctestArgs = @(
            '--test-dir', 'build',
            '-C', 'Release',
            '--output-on-failure',
            '--timeout', '900',
            '--parallel', "$env:NUMBER_OF_PROCESSORS"
          )
          if ($ctestHelp -match '--output-junit') {
            $ctestArgs += @('--output-junit', $junitPath)
          } else {
            Write-Warning 'CTest does not support --output-junit (requires CTest 3.21 or newer); JUnit XML will not be published.'
          }

          & ctest @ctestArgs
          $testStatus = $LASTEXITCODE
          if (Test-Path -LiteralPath $junitPath -PathType Leaf) {
            "junit_file=$junitFileName" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            Write-Warning "CTest did not produce JUnit XML: $junitPath"
          }


          if ($testStatus -ne 0) {
            exit $testStatus
          }

      - name: Publish Windows CPU JUnit XML
        if: always() && steps.test.outputs.junit_file != ''
        uses: ./.github/actions/llamango-upload-release-asset
        with:
          release-tag: ${{ inputs.release_tag }}
          asset-path: ${{ steps.test.outputs.junit_file }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-release: 'false'

      - name: Upload ccache debug logs
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: ccache-debug-windows-${{ inputs.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ccache-debug
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Cleanup ccache
        if: always() && !cancelled()
        uses: ./.github/actions/llamango-ccache-cleanup
        with:
          cache-key-prefix: ${{ inputs.cache_key_prefix }}
