name: Cleanup Llamango ccache

description: Delete ccache entries that have not been accessed for more than 100 hours.

inputs:
  cache-key-prefix:
    description: Stable prefix for the ccache key.
    required: true

runs:
  using: composite
  steps:
    - name: Delete ccache entries unused for more than 100 hours
      uses: actions/github-script@v9
      continue-on-error: true
      env:
        CACHE_KEY_PREFIX: ${{ inputs.cache-key-prefix }}
      with:
        github-token: ${{ github.token }}
        script: |
          const prefix = process.env.CACHE_KEY_PREFIX;
          const { owner, repo } = context.repo;
          const ref = context.ref;
          const maxUnusedMs = 100 * 60 * 60 * 1000;
          const cutoff = Date.now() - maxUnusedMs;
          const caches = [];

          for (let page = 1; ; page += 1) {
            const { data } = await github.request(
              "GET /repos/{owner}/{repo}/actions/caches",
              {
                owner,
                repo,
                ref,
                key: prefix,
                per_page: 100,
                page,
              },
            );
            const pageCaches = data.actions_caches ?? [];
            caches.push(
              ...pageCaches.filter(
                (cache) =>
                  cache.ref === ref && cache.key.startsWith(`${prefix}-`),
              ),
            );

            if (pageCaches.length < 100) {
              break;
            }
          }

          for (const cache of caches) {
            const lastAccessedAt = Date.parse(cache.last_accessed_at);
            if (!Number.isFinite(lastAccessedAt) || lastAccessedAt > cutoff) {
              continue;
            }

            try {
              await github.request(
                "DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}",
                { owner, repo, cache_id: cache.id },
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
          }
